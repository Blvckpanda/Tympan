<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Links Fixture</title>
<style>
  body { font-family: Arial, sans-serif; }
  main { max-width: 870px; margin: 0 auto; }
  section { padding: 32px; border: 1px solid #ddd; margin-bottom: 24px; }
</style>
</head>
<body>
<main>
  <section class="page-section" id="one">
    <h1>Section One</h1>
    <p>Visit <a href="https://example.com/">example.com</a> for more.</p>
  </section>
  <section class="page-section" id="two">
    <h1>Section Two</h1>
    <p>Also see <a href="https://example.org/">example.org</a>.</p>
  </section>
</main>
</body>
</html>
