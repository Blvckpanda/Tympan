<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, Helvetica, sans-serif; }
  main { max-width: 870px; margin: 0 auto; }
  .page-section { padding: 32px; border: 1px solid #ddd; margin-bottom: 24px; }
  .cover-page { min-height: 60vh; background: #0e7490; color: #fff; }
  h1 { font-size: 28px; margin: 0 0 8px 0; }
  p { font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <section class="page-section cover-page" id="cover">
    <h1>Fixture Cover</h1>
    <p>Section one of the hostile fixture.</p>
  </section>
  <section class="page-section" id="mid">
    <h1>Fixture Mid</h1>
    <p>Section two. Detection should report the page-section-class strategy.</p>
  </section>
  <section class="page-section" id="contact">
    <h1>Fixture Contact</h1>
    <p>Section three with the canonical link.</p>
  </section>
  <div class="text-center">
    <p>www.fixture-deck.example</p>
  </div>
</main>
<script>
  // Hostile runtime print CSS: would force fragmentation in a naive page.pdf().
  const st = document.createElement('style');
  st.textContent = '@media print { .page-section { break-before: page; break-after: page; } .cover-page { height: 100vh; } @page { size: A4; } }';
  document.head.appendChild(st);
</script>
</body>
</html>
