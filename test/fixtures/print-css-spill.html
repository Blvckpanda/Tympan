<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>print-css spill probe</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #111; }
  main { max-width: 700px; margin: 0 auto; }
  section.page-section { padding: 20px; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 12px; }
  /* Only a browser's PRINT media sees this. If tympan copies the source's
     styles verbatim, each section becomes 2000px tall at print time and the
     spill guard fires ("SPILL PAGES") no matter how far it shrinks. */
  @media print {
    section.page-section { min-height: 2000px; }
  }
  /* A page rule too: it must not reach the clean template either. */
  @page { margin: 0; }
</style>
</head>
<body>
<main>
  <section class="page-section" id="one"><h2>One</h2><p>Hello world, a paragraph that prints.</p></section>
  <section class="page-section" id="two"><h2>Two</h2><p>Second paragraph.</p></section>
</main>
</body>
</html>
