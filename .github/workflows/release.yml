name: Release

# Publishes to npm when a version tag (v*) is pushed. See PUBLISHING.md.
# Authentication: npm trusted publishing — OIDC from GitHub Actions.
# There is no npm token secret in this repository, by design: the publish
# step authenticates via the package's Trusted Publisher entry
# (Blvckpanda/Tympan, release.yml) and needs `id-token: write` only.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and attach the tarball
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Trusted publishing (OIDC publish) requires npm >= 11.5.1; setup-node
      # can ship an older npm. Upgrade unconditionally — no-op when current.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Pack dry-run guard (whitelist + tarball sanity)
        run: |
          npm pack --dry-run
          npm pack
      - name: Publish to npm (trusted publishing, no token)
        run: npm publish --provenance --access public
      - name: GitHub Release (attach tarball)
        uses: softprops/action-gh-release@v2
        with:
          files: tympan-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
