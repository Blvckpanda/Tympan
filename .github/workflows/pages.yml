# Deploy the landing/ page to GitHub Pages.
# One-time setup (done in repo Settings -> Pages -> Build and deployment):
#   Source: GitHub Actions. The workflow can only publish once that source is set.
name: pages

on:
  push:
    branches: [main]
    paths: [landing/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
